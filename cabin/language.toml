# Common interphone wording; operational numbers are never corrected.
split = '\s+(?:and|then)\s+|[,;]'
cross_check = '^(?:(?:can|could|would) you\s+)?(?:please\s+)?(?:cross[ -]?check|xcheck)(?: the doors| the slides)?(?: please)?[.!?]?$'
drink = '^(?:(?:(?:can|could|may) i (?:please )?(?:have|get)|do you have time to (?:bring|get)(?: me)?|(?:can|could|would) you (?:please )?(?:bring|get)(?: me)?|(?:please )?(?:bring|get)(?: me)?)\s+)?(?:a |some |my )?(?:quick )?(coffee|coffe|tea|water|meal|food|lunch|dinner|breakfast|snack|juice|sandwich|sandwiches)(?: please)?(?: before (?:we )?push ?back)?[.!?]?$'

# Social clauses stay in the actor prompt but do not become control commands.
social = '^(?:have a beer for me(?: after that)?[.! ]*(?:you deserve it[.! ]*)?(?:ha(?:ha)*[.! ]*)?|(?:thanks|thank you)(?: very much)?[.! ]*|you deserve it[.! ]*(?:ha(?:ha)*[.! ]*)?)$'

statement = '^(?:i|we) (?:have |already )?(?:turned|switched|set|removed|disconnected|connected)\b'

# Crew narration cannot grant operational authority, including after failed checks.
narration_reject = ['(?i)\b(?:clear(?:ed)?|approved|authori[sz]ed)\s+(?:for|to)\s+(?:arm(?:ing)?|disarm(?:ing)?|depart|take ?off|cross|land)\b']

