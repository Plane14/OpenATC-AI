[package]
name = "openatc-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dubins_paths = "=3.1.0"
earcutr = "=0.4.3"
regex = "=1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
serde_repr = "=0.1.21"
toml = "=0.8.23"

[lints]
workspace = true
