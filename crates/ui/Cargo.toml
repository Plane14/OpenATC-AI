[package]
name = "openatc-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "openatc_ui"
path = "src/lib.rs"

[dependencies]
imgui = { version = "=0.12.0", features = ["tables-api"] }
glow = "=0.14.2"
openatc-http = { path = "../http" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
openatc-core = { path = "../core" }
openatc-settings = { path = "../settings" }
openatc-audio = { path = "../audio" }

arboard = { version = "=3.6.1", default-features = false }

[lints]
workspace = true
