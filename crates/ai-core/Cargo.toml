[package]
name = "openatc-ai-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AI core functionality for OpenATC"
repository = "https://github.com/billpayne4x4/OpenATC-AI"
readme = "README.md"
keywords = ["x-plane", "atc", "ai", "llm"]
categories = ["simulation", "game-development", "machine-learning"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"
toml = "=1.1.6"

[lints]
workspace = true
