[package]
name = "openatc-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-atc-engine"
path = "src/main.rs"

[dependencies]
toml = "=0.8.23"
axum = { version = "=0.8.9", features = ["multipart"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["full"] }
rand = "=0.9.5"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "=0.23.0", default-features = false }
openatc-core = { path = "../core" }
openatc-settings = { path = "../settings" }

[lints]
workspace = true
