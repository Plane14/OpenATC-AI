[package]
name = "openatc-tts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Text-to-speech engine for OpenATC"
repository = "https://github.com/billpayne4x4/OpenATC-AI"
readme = "README.md"
keywords = ["x-plane", "atc", "tts", "speech", "audio"]
categories = ["simulation", "game-development", "audio", "machine-learning"]

[dependencies]
hound = "=3.5.1"
espeak-rs = "=0.1.9"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
misaki-rs = "=0.6.0"
ndarray = "=0.17.2"
ndarray-npy = "=0.10.0"
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
rand = "=0.8.8"
rand_distr = "=0.4.3"
rand_pcg = "=0.3.1"
rustfft = "=6.4.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[features]
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]

[lints]
workspace = true
