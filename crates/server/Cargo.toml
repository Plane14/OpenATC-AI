[package]
name = "openatc-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "openatc-ai"
path = "src/main.rs"

[dependencies]
openatc-ai-core = { path = "../ai-core" }
openatc-platform = { path = "../platform" }
openatc-tts = { path = "../tts" }
axum = { version = "=0.8.9", features = ["multipart"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "=4.6.7", features = ["derive"] }
llama-cpp-2 = "=0.1.158"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["full"] }
toml = "=1.1.6+spec-1.1.0"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }

[features]
tts-cuda = ["openatc-tts/cuda"]
tts-coreml = ["openatc-tts/coreml"]
kokoro-cuda = ["tts-cuda"]
kokoro-coreml = ["tts-coreml"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[lints]
workspace = true
