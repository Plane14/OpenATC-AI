[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
openatc-core = { path = "../crates/core" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
toml = "=0.8.23"
openatc-platform = { path = "../crates/platform" }
