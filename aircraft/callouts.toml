# Editable callouts and speed sources. Never substitute nominal performance speeds.
version = 1
enabled = true
minimum_knots = 35.0
maximum_knots = 250.0
reset_below_knots = 20.0
maximum_agl_feet = 500.0
maximum_delay_seconds = 1.0
# ToLiss performance refs contain speed values; legacy V1/VR refs are display-pointer offsets.
# These documented stock bugs are V1, VR and V2. Custom profiles may override the sources.
ias_refs = ["sim/flightmodel/position/indicated_airspeed", "sim/cockpit2/gauges/indicators/airspeed_kts_pilot"]
v1_refs = ["toliss_airbus/performance/V1", "AirbusFBW/V1Value", "sim/cockpit2/gauges/actuators/airspeed_bugs[0]"]
vr_refs = ["toliss_airbus/performance/VR", "toliss_airbus/pfdoutputs/general/VR_value", "sim/cockpit2/gauges/actuators/airspeed_bugs[1]"]
v2_refs = ["toliss_airbus/performance/V2","sim/cockpit2/gauges/actuators/airspeed_bugs[2]"]
v1_text = "V one"
vr_text = "Rotate"
v1_vr_text = "V one. Rotate"
log_labels = ["V1", "Rotate"]
log_template = "{callout} · {speed} kt"

[roll]
airspeed_alive_knots = 35.0
eighty_knots = 80.0
airspeed_alive_text = "Airspeed alive"
eighty_knots_text = "80 knots"

[positive]
minimum_agl_feet = 5.0
minimum_climb_fpm = 100.0
confirmation_seconds = 0.3
text = "Positive rate"
