# Setting a code never changes the transponder/TCAS mode selector.
code_dataref = "sim/cockpit/radios/transponder_code"

code_digits = ["AirbusFBW/XPDR1", "AirbusFBW/XPDR2", "AirbusFBW/XPDR3", "AirbusFBW/XPDR4"]

# ToLiss single-aisle AUTO/ON selector; leave XPDRPower untouched.
[power]
dataref = "AirbusFBW/XPDRTCASMode"
on = 1
