# Setting a code never changes the transponder/TCAS mode selector.
default_code_dataref = "sim/cockpit2/radios/actuators/transponder_code"
code_dataref = "sim/cockpit/radios/transponder_code"

# Digits are listed left to right; ToLiss numbers them from the right.
code_digits = ["AirbusFBW/XPDR4", "AirbusFBW/XPDR3", "AirbusFBW/XPDR2", "AirbusFBW/XPDR1"]

# ToLiss single-aisle AUTO/ON selector; leave XPDRPower untouched.
[power]
dataref = "AirbusFBW/XPDRTCASMode"
on = 1
