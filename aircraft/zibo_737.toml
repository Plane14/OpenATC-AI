[aircraft]
name = "Zibo 737-800X"
match_author = "zibo"
match_icao = ["B738"]

[aircraft.comms]
attendant_refs = []
ground_refs = []
emer_action = "ignore"

[aircraft.electrical]
bat_volts_ref = "sim/cockpit2/electrical/bus_volts[0]"
min_volts = 22.0
battery_refs = ["sim/cockpit2/electrical/battery_on[0]"]
gpu_refs = ["sim/cockpit2/electrical/GPU_generator_on"]
apu_refs = ["sim/cockpit/electrical/generator_apu_on"]
rmp_refs = []
avionics_refs = ["sim/cockpit2/switches/avionics_power_on"]

[aircraft.autopilot]
mode_ref = "sim/cockpit/autopilot/autopilot_mode"
altitude_ref = "sim/cockpit/autopilot/altitude"
heading_ref = "sim/cockpit/autopilot/heading_mag"
speed_ref = "sim/cockpit/autopilot/airspeed"

[aircraft.radio]
com1_active_ref = "sim/cockpit2/radios/actuators/com1_frequency_hz_833"

