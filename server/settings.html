<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OpenATC AI server settings</title>
<style>body{font:16px system-ui;background:#17232e;color:#edf5fb;max-width:760px;margin:32px auto;padding:20px}label{display:block;margin-top:20px}input,select,button{font:inherit;padding:8px;border-radius:4px}input:not([type=checkbox]),select{display:block;width:95%;margin-top:6px}small{display:block;color:#b9c9d7;margin-top:5px}button{margin-top:24px;cursor:pointer}#status{white-space:pre-wrap}</style>
<h1>OpenATC AI server settings</h1><p>Choose resources for this computer. Automatic context sizing is optional. Restart the inference server after saving.</p><form id="form"></form><button id="save">Save settings</button><p id="status" role="status"></p>
<script>
let fields=[],current={};const status=document.getElementById('status'),form=document.getElementById('form');
fetch('/settings').then(r=>{if(!r.ok)throw Error('Cannot load settings');return r.json()}).then(data=>{fields=data.fields;current=data.values;for(const f of fields){const label=document.createElement('label');label.textContent=f.label;const input=document.createElement(f.choices.length?'select':'input');input.id=f.key;const value=current[f.key]??f.default;if(f.choices.length){for(const choice of f.choices){const option=document.createElement('option');option.value=choice;option.textContent=choice;input.append(option)}input.value=value}else if(f.kind==='boolean'){input.type='checkbox';input.checked=value}else{input.type=f.kind==='integer'?'number':'text';input.value=value}label.append(input);const help=document.createElement('small');help.textContent=f.help;label.append(help);form.append(label)}}).catch(e=>status.textContent=e.message);
document.getElementById('save').onclick=async()=>{const values={...current};for(const f of fields){const input=document.getElementById(f.key);values[f.key]=f.kind==='boolean'?input.checked:f.kind==='integer'?Number(input.value):input.value}try{const r=await fetch('/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});if(!r.ok)throw Error(await r.text());status.textContent='Saved. Restart the inference server to apply these settings.'}catch(e){status.textContent=e.message}};
</script></html>
