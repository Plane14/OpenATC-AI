version = 1
id = "rough-air"
title = "Coastal rough-air briefing"
briefing = "A short coastal flight with a cabin preparedness exercise. The story reports passenger discomfort; it does not change simulator weather or invent a radar return. Brief the cabin, use the seatbelt sign as appropriate and request a deviation or altitude change from ATC if required."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "KSFO"
destination = "KMRY"
duration_minutes = 30
media = []

[[events]]
id = "cabin_call"
phase = "cruise"
delay_seconds = 20
probability = 100
severity = "urgent"
seat = "22F"
say = [
  "Captain, several passengers are uncomfortable, and the passenger in {seat} is feeling unwell. We have paused service. What conditions should we expect?",
  "Captain, cabin update: the passenger in {seat} needs assistance and a few others are feeling unsettled. Can you brief us on the expected conditions?",
  "Captain, we have stopped service while we check on a passenger in {seat}. Please advise the conditions ahead and the time available to secure the cabin.",
]

[[events.choices]]
id = "coordinate"
label = "Prepare the cabin and keep me updated."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Understood, Captain. We will secure the service equipment, check on passengers and report back. Please advise if conditions change.", "Understood. We will prepare the cabin and keep you informed. Please let us know whether the level change is approved."]

[[events.choices]]
id = "assess"
label = "I will ask ATC for a smoother level; secure the cabin."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Understood. We will prepare the cabin and keep you informed. Please let us know whether the level change is approved.", "Understood, Captain. We will secure the service equipment, check on passengers and report back. Please advise if conditions change."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

