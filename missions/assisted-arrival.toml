version = 1
id = "assisted-arrival"
title = "A considerate arrival"
briefing = "A short Bass Strait service into Hobart. Coordinate passenger assistance and an appropriate stand, then complete the full taxi-in and gate handover. Assistance and passenger positions are simulated story facts; aircraft controls are still verified separately."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "YMML"
destination = "YMHB"
duration_minutes = 60
media = []

[[events]]
id = "cabin_call"
phase = "arrival"
delay_seconds = 20
probability = 100
severity = "normal"
seat = "3C"
say = [
  "Captain, the passenger in {seat} will need mobility assistance on arrival. Could you request a suitable stand and confirm assistance is arranged?",
  "Captain, our passenger in {seat} needs extra time and assistance when leaving the aircraft. Please include that in the arrival arrangements.",
  "Captain, a quick arrival update: we need mobility assistance for {seat}. We will keep the passenger comfortable while you arrange parking.",
]

[[events.choices]]
id = "coordinate"
label = "I will request a suitable stand and assistance."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Thank you, Captain. We will explain the plan and let the passenger know once assistance is confirmed.", "Will do, Captain. We will keep them comfortable and wait for confirmation of the arrival arrangements."]

[[events.choices]]
id = "assess"
label = "Please keep the passenger informed while I coordinate with Ground."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Will do, Captain. We will keep them comfortable and wait for confirmation of the arrival arrangements.", "Thank you, Captain. We will explain the plan and let the passenger know once assistance is confirmed."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

