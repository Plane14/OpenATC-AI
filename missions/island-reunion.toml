version = 1
id = "island-reunion"
title = "An island reunion"
briefing = "A short Balearic Islands service with a family reunion on board. Light cabin interaction, service requests and a normal approach are the focus. Passenger announcements remain optional and require the captain's request."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "LEPA"
destination = "LEIB"
duration_minutes = 30
media = []

[[events]]
id = "cabin_call"
phase = "cruise"
delay_seconds = 20
probability = 100
severity = "normal"
seat = "8A"
say = [
  "Captain, a family near {seat} is travelling for a reunion. They asked whether you might give them a little welcome when you have time.",
  "Captain, we have a happy reunion group around {seat}. They are enjoying the trip and asked if a short greeting would be possible.",
  "Captain, the family in row eight is celebrating a reunion. No action needed straight away, but a greeting would make their day.",
]

[[events.choices]]
id = "coordinate"
label = "Please pass on my best wishes; I will make a PA when convenient."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Certainly, Captain. We will pass that on. They have already taken enough photos to fill an album.", "Of course. We will give them your best wishes and keep the aisle clear while they celebrate."]

[[events.choices]]
id = "assess"
label = "Please pass on my best wishes for the reunion."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Of course. We will give them your best wishes and keep the aisle clear while they celebrate.", "Certainly, Captain. We will pass that on. They have already taken enough photos to fill an album."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

