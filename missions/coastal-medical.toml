version = 1
id = "coastal-medical"
title = "Coastal medical diversion"
briefing = "A short Southern California positioning flight with passengers. A fictional passenger illness interrupts the climb. Coordinate with cabin crew, advise ATC of your intentions and decide whether to continue or request a diversion. Use a current IFR plan; this story does not supply navigation clearance."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "KLAX"
destination = "KLGB"
duration_minutes = 25
media = []

[[events]]
id = "cabin_call"
phase = "departure"
delay_seconds = 20
probability = 100
severity = "emergency"
seat = "12A"
say = [
  "Captain, the passenger in {seat} has chest pain and is becoming less responsive. We have called for medical assistance in the cabin. Please advise your intentions.",
  "Captain, urgent cabin call. The passenger in {seat} is seriously unwell, with chest pain. The crew are assisting and looking for a medical professional. Can you advise the landing plan?",
  "Captain, we have a possible cardiac emergency at {seat}. We cannot confirm a diagnosis. Medical assistance is being sought; please advise how soon we can land.",
]

[[events.choices]]
id = "coordinate"
label = "I will advise ATC and arrange a priority landing."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Understood, Captain. We will continue assisting and pass on any change. Please give us the expected time to landing.", "Understood. We will keep you updated from {seat}. Let us know the destination and time available to prepare."]

[[events.choices]]
id = "assess"
label = "Keep me updated; I am assessing the nearest suitable airport."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Understood. We will keep you updated from {seat}. Let us know the destination and time available to prepare.", "Understood, Captain. We will continue assisting and pass on any change. Please give us the expected time to landing."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]


[[events]]
id = "assessment_follow_up"
phase = "departure"
delay_seconds = 60
probability = 100
after_event = "cabin_call"
after_outcome = "assessing"
severity = "emergency"
seat = "12A"
say = [
  "Captain, an update from {seat}: the passenger remains seriously unwell. We need your landing intentions when workload permits.",
  "Captain, the situation at {seat} has not improved. Please advise the cabin team of your landing plan as soon as you can.",
]

[[events.choices]]
id = "priority_landing"
label = "I am requesting a priority landing; stand by for our landing time."
aliases = ["Requesting a priority landing"]
outcome = "priority_requested"
say = ["Understood, Captain. We will continue assisting and await your update.", "Thank you, Captain. We are standing by for the landing time."]
