version = 1
id = "nervous-flyer"
title = "A first flight over the coast"
briefing = "A friendly short A320 service along the Mediterranean coast. Reassure a nervous first-time flyer through the cabin crew, keep safety briefings professional and coordinate the normal arrival."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "LFMN"
destination = "LFML"
duration_minutes = 30
media = []

[[events]]
id = "cabin_call"
phase = "departure"
delay_seconds = 20
probability = 100
severity = "normal"
seat = "14F"
say = [
  "Captain, the passenger in {seat} is on their first flight and feeling a little anxious. A calm update about the flight would help when you have a moment.",
  "Captain, a first-time flyer in {seat} asked whether the sounds after takeoff are normal. Could you give us a short explanation when workload permits?",
  "Captain, we are reassuring a nervous passenger in {seat}. Is there a simple flight update you would like us to pass on?",
]

[[events.choices]]
id = "coordinate"
label = "Please reassure them; I will make an announcement when workload permits."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Of course, Captain. We will stay with them and pass that on. Sometimes a friendly face makes all the difference.", "Will do, Captain. We will keep the explanation calm and simple and let you know how they get on."]

[[events.choices]]
id = "assess"
label = "Please stay with them and let me know if they need more help."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Will do, Captain. We will keep the explanation calm and simple and let you know how they get on.", "Of course, Captain. We will stay with them and pass that on. Sometimes a friendly face makes all the difference."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

