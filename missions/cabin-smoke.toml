version = 1
id = "cabin-smoke"
title = "An urgent cabin report"
briefing = "A fictional cabin smoke report on a short New Zealand flight. Practise clear communication, emergency declaration and a landing decision. The story does not inject fire into the aircraft or provide firefighting instructions; follow the aircraft/operator checklist."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "NZCH"
destination = "NZWN"
duration_minutes = 40
media = []

[[events]]
id = "cabin_call"
phase = "cruise"
delay_seconds = 20
probability = 100
severity = "emergency"
seat = "24D"
say = [
  "Captain, urgent call: we have a report of smoke near {seat}. The crew are investigating and following our emergency procedures. Please advise your intentions.",
  "Captain, smoke has been reported in the cabin near {seat}. We are responding under our procedures. We need your landing plan.",
  "Captain, an urgent cabin situation near {seat}: smoke has been reported. We will keep you informed as we establish the source. Please advise time to landing.",
]

[[events.choices]]
id = "coordinate"
label = "I will declare an emergency and arrange landing."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Understood, Captain. We will keep the flight deck updated and prepare for your landing plan. Please confirm the time available.", "Understood. We will continue our procedures and report any change immediately."]

[[events.choices]]
id = "assess"
label = "Continue your procedures and keep me informed; I am coordinating with ATC."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Understood. We will continue our procedures and report any change immediately.", "Understood, Captain. We will keep the flight deck updated and prepare for your landing plan. Please confirm the time available."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

