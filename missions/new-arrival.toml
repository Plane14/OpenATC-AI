version = 1
id = "new-arrival"
title = "An unexpected new arrival"
briefing = "A short Sydney to Canberra service turns into an unusual cabin-coordination exercise. A passenger may be in labour. The captain decides the operational response, with the cabin asking for medical assistance. This scenario teaches communication, not clinical treatment."
aircraft = ["A320", "A20N", "A319", "A19N", "A321", "A21N"]
departure = "YSSY"
destination = "YSCB"
duration_minutes = 40
media = []

[[events]]
id = "cabin_call"
phase = "cruise"
delay_seconds = 20
probability = 100
severity = "urgent"
seat = "18C"
say = [
  "Captain, the passenger in {seat} says she is having contractions. We have requested medical assistance in the cabin. Please advise your intentions.",
  "Captain, we may have a passenger in labour at {seat}. A crew member is staying with her. Can you advise the estimated time to landing?",
  "Captain, an urgent update from {seat}: the passenger believes labour has started. We are seeking medical help and need your landing plan.",
]

[[events.choices]]
id = "coordinate"
label = "I will request priority and medical assistance on arrival."
aliases = ["I will coordinate with ATC"]
outcome = "coordinating"
say = ["Understood, Captain. We will pass on any change and prepare for your landing plan. Please keep us advised of the time available.", "Understood. We will continue assisting and keep the aisle clear. Let us know when you have the revised landing plan."]

[[events.choices]]
id = "assess"
label = "I will speak to ATC about a diversion; keep me updated."
aliases = ["Keep me updated"]
outcome = "assessing"
say = ["Understood. We will continue assisting and keep the aisle clear. Let us know when you have the revised landing plan.", "Understood, Captain. We will pass on any change and prepare for your landing plan. Please keep us advised of the time available."]

[[events]]
id = "arrival_handover"
phase = "taxi_in"
delay_seconds = 5
probability = 100
severity = "normal"
say = ["Captain, we are ready for the arrival handover. Please let us know when the aircraft is parked and it is safe to begin.", "Captain, the cabin team is standing by for parking and the arrival handover. We will wait for your instructions."]

[[events.choices]]
id = "wait_for_parking"
label = "Remain seated until we are parked; I will let you know."
aliases = ["Wait until we are parked", "Remain seated"]
outcome = "waiting_for_parking"
say = ["Understood, Captain. We will remain seated and wait for your call.", "Understood. We will keep everyone seated until you advise."]

