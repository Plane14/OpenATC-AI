name: Native platform builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (for example 0.0.1-alpha.1); manual runs do not publish'
        required: true
        default: '0.0.1-alpha.1'
      platform:
        description: 'Platform to test (all excludes Intel Mac; select macos-intel explicitly on demand)'
        type: choice
        options: [all, linux-x64, windows-x64, macos-intel, macos-arm64]
        default: all
      product:
        description: 'Product to test'
        type: choice
        options: [all, plugin, ai-server]
        default: all
      preflight_only:
        description: 'Check installer packaging with small fixtures; skip full application/model builds'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      preflight: ${{ steps.matrix.outputs.preflight }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - id: matrix
        env:
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
          INPUT_PRODUCT: ${{ inputs.product || 'all' }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || { echo 'Invalid version'; exit 1; }
          matrix='[]'
          for platform in linux-x64 windows-x64 macos-intel macos-arm64; do
            # Keep Intel Mac available only for an explicit manual request.
            if [ "$platform" = macos-intel ] && { [ "$EVENT_NAME" != workflow_dispatch ] || [ "$INPUT_PLATFORM" != macos-intel ]; }; then continue; fi
            [ "$INPUT_PLATFORM" = all ] || [ "$INPUT_PLATFORM" = "$platform" ] || continue
            case "$platform" in
              linux-x64) runner=ubuntu-22.04 ;;
              windows-x64) runner=windows-2022 ;;
              macos-intel) runner=macos-15-intel ;;
              macos-arm64) runner=macos-15 ;;
            esac
            for product in plugin ai-server; do
              [ "$INPUT_PRODUCT" = all ] || [ "$INPUT_PRODUCT" = "$product" ] || continue
              build_runner="$runner"
              if [ "$platform" = linux-x64 ] && [ "$product" = ai-server ]; then build_runner=ubuntu-24.04; fi
              matrix=$(jq -c --arg platform "$platform" --arg product "$product" --arg runner "$build_runner" '. + [{platform:$platform,product:$product,runner:$runner}]' <<< "$matrix")
            done
          done
          [ "$matrix" != '[]' ] || { echo 'No build targets selected'; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "preflight=$(jq -c 'unique_by(.platform) | map({platform,runner})' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  checks:
    if: ${{ inputs.preflight_only != true }}
    uses: ./.github/workflows/build.yml
  packaging-preflight:
    needs: prepare
    name: Installer preflight / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.preflight) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Visual Studio build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VCToolsVersion', 'VisualStudioVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: installer-preflight-${{ matrix.platform }}
      - name: Locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup 6 was not found in the machine or user installation directories' }
          Write-Host "Using Inno Setup compiler at $compiler; packaging preflight reports the engine version and checks compatibility."
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Select Windows packaging linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if ($linker -notmatch 'Microsoft Visual Studio') { throw "Expected the MSVC linker, found $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Test installer discovery and transactions
        run: cargo test --locked -p xtask installer::tests
      - name: Validate Windows installer assets and native package generation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($document in @('docs/INSTALL.md', 'docs/RELEASE_PACKAGING.md')) {
            if (!(Test-Path -LiteralPath $document -PathType Leaf)) { throw "Missing installer document: $document" }
            if ((Get-Item -LiteralPath $document).Length -eq 0) { throw "Empty installer document: $document" }
          }
          cargo run --locked -p xtask -- release-preflight ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Linux and macOS installer assets and native package generation
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -s docs/INSTALL.md
          test -s docs/RELEASE_PACKAGING.md
          cargo run --locked -p xtask -- release-preflight ${{ matrix.platform }}
  native:
    if: ${{ inputs.preflight_only != true }}
    needs: [prepare, checks, packaging-preflight]
    name: ${{ matrix.platform }} / ${{ matrix.product }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}-${{ matrix.product }}${{ matrix.platform == 'windows-x64' && matrix.product == 'ai-server' && '-ninja-v1' || matrix.platform == 'linux-x64' && matrix.product == 'ai-server' && '-ubuntu24-system-vulkan-v2' || '' }}
      - name: Import Visual Studio build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('Path', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VCToolsVersion', 'VisualStudioVersion', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" >> $env:GITHUB_ENV }
          }
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config
      - name: Configure Windows native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang\libclang.dll")) { throw 'libclang.dll is missing' }
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if ($linker -notmatch 'Microsoft Visual Studio') { throw "Expected the MSVC linker, found $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          if ('${{ matrix.product }}' -eq 'ai-server') {
            Get-Command ninja.exe -ErrorAction Stop | Out-Null
            'CMAKE_GENERATOR=Ninja' >> $env:GITHUB_ENV
          }
      - uses: actions/cache@v6.1.0
        if: runner.os == 'Windows' && matrix.product == 'ai-server'
        id: vulkan-cache
        with:
          path: ${{ runner.temp }}/openatc-vulkan
          key: vulkan-1.4.341.1-${{ runner.os }}
      - name: Install Linux Vulkan build tools
        if: runner.os == 'Linux' && matrix.product == 'ai-server'
        run: |
          set -euo pipefail
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          pkg-config --exists vulkan
          glslc --version
          printf '#version 450\nlayout(local_size_x = 1) in;\nvoid main() {}\n' > "$RUNNER_TEMP/openatc-vulkan-check.comp"
          glslc --target-env=vulkan1.3 "$RUNNER_TEMP/openatc-vulkan-check.comp" -o "$RUNNER_TEMP/openatc-vulkan-check.spv"
          printf '#include <vulkan/vulkan.h>\nint main(void) { return vkGetInstanceProcAddr(VK_NULL_HANDLE, "vkCreateInstance") == 0; }\n' | cc -x c - -lvulkan -o "$RUNNER_TEMP/openatc-vulkan-link-check"
          "$RUNNER_TEMP/openatc-vulkan-link-check"
      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows' && matrix.product == 'ai-server'
        shell: pwsh
        run: |
          $sdk = "$env:RUNNER_TEMP\openatc-vulkan"
          if (!(Test-Path "$sdk\Bin\glslc.exe")) {
            $installer = "$env:RUNNER_TEMP\vulkan.exe"
            Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.4.341.1/windows/vulkansdk-windows-X64-1.4.341.1.exe -OutFile $installer
            $process = Start-Process $installer -ArgumentList @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($process.ExitCode)" }
          }
          if (!(Test-Path "$sdk\Bin\glslc.exe")) { throw 'Vulkan shader compiler is missing' }
          $runtime = "$env:RUNNER_TEMP\openatc-vulkan-runtime"
          $archive = "$env:RUNNER_TEMP\vulkan-runtime.zip"
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.4.341.0/windows/VulkanRT-X64-1.4.341.0-Components.zip -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '20571dcc8292b80a47d68bbbfa4094d87044041f50f4e2e1f326a01e3732b226') { throw 'Vulkan runtime archive checksum mismatch' }
          Expand-Archive $archive -DestinationPath $runtime -Force
          $loader = "$runtime\VulkanRT-X64-1.4.341.0-Components\x64\vulkan-1.dll"
          if ((Get-FileHash $loader -Algorithm SHA256).Hash -ne '98bc6e33b384f83e8cc36174ce1ba81357611d0cbe03462e1ca58d0663034039') { throw 'Vulkan x64 loader checksum mismatch' }
          "OPENATC_VULKAN_LOADER=$loader" >> $env:GITHUB_ENV
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Find Apple SDK and libclang
        if: runner.os == 'macOS'
        run: |
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Import optional Windows publisher certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPENATC_WINDOWS_CERT_PFX_BASE64: ${{ secrets.OPENATC_WINDOWS_CERT_PFX_BASE64 }}
          OPENATC_WINDOWS_CERT_PASSWORD: ${{ secrets.OPENATC_WINDOWS_CERT_PASSWORD }}
        run: ./packaging/installer/import-signing.ps1
      - name: Import optional Apple publisher certificate
        if: runner.os == 'macOS'
        env:
          OPENATC_MAC_CERT_P12_BASE64: ${{ secrets.OPENATC_MAC_CERT_P12_BASE64 }}
          OPENATC_MAC_CERT_PASSWORD: ${{ secrets.OPENATC_MAC_CERT_PASSWORD }}
          OPENATC_MAC_SIGN_IDENTITY: ${{ secrets.OPENATC_MAC_SIGN_IDENTITY }}
          OPENATC_APPLE_ID: ${{ secrets.OPENATC_APPLE_ID }}
          OPENATC_APPLE_PASSWORD: ${{ secrets.OPENATC_APPLE_PASSWORD }}
          OPENATC_APPLE_TEAM_ID: ${{ secrets.OPENATC_APPLE_TEAM_ID }}
        run: bash packaging/installer/import-signing.sh
      - uses: actions/cache@v6.1.0
        if: matrix.platform == 'macos-intel' && matrix.product == 'ai-server'
        id: onnx-cache
        with:
          path: ${{ runner.temp }}/openatc-onnx
          key: onnxruntime-1.28.0-macos15-intel-coreml-cmake-policy-v3
      - uses: actions/checkout@v7.0.1
        if: matrix.platform == 'macos-intel' && matrix.product == 'ai-server' && steps.onnx-cache.outputs.cache-hit != 'true' 
        with:
          repository: microsoft/onnxruntime
          ref: v1.28.0
          path: build-deps/onnxruntime
          submodules: recursive
      - name: Build ONNX Runtime for Intel Mac
        if: matrix.platform == 'macos-intel' && matrix.product == 'ai-server' && steps.onnx-cache.outputs.cache-hit != 'true'
        run: |
          cd build-deps/onnxruntime
          ./build.sh --config Release --build_shared_lib --use_coreml --parallel 3 --skip_tests --compile_no_warning_as_error --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF CMAKE_POLICY_VERSION_MINIMUM=3.5 CMAKE_OSX_ARCHITECTURES=x86_64 CMAKE_INSTALL_RPATH=@loader_path
          runtime="$PWD/build/MacOS/Release"
          test -f "$runtime/libonnxruntime.dylib"
          mkdir -p "$RUNNER_TEMP/openatc-onnx"
          cp -L "$runtime"/libonnxruntime*.dylib "$RUNNER_TEMP/openatc-onnx/"
      - name: Configure Intel Mac ONNX library
        if: matrix.platform == 'macos-intel' && matrix.product == 'ai-server'
        run: |
          test -f "$RUNNER_TEMP/openatc-onnx/libonnxruntime.dylib"
          echo "ORT_LIB_PATH=$RUNNER_TEMP/openatc-onnx" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,@loader_path' >> "$GITHUB_ENV"
      - name: Test shared code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked -p openatc-core -p openatc-settings -p openatc-platform -p openatc-http -p xtask
      - name: Test shared code on Linux and macOS
        if: runner.os != 'Windows'
        run: cargo test --locked -p openatc-core -p openatc-settings -p openatc-platform -p openatc-http -p xtask
      - name: Build Windows plugin and companion engine
        if: runner.os == 'Windows' && matrix.product == 'plugin'
        shell: pwsh
        run: cargo build --locked --release -p openatc-plugin -p openatc-engine
      - name: Build Linux and macOS plugin and companion engine
        if: runner.os != 'Windows' && matrix.product == 'plugin'
        run: cargo build --locked --release -p openatc-plugin -p openatc-engine
      - name: Build Windows AI server and speech sidecar
        if: runner.os == 'Windows' && matrix.product == 'ai-server'
        shell: pwsh
        run: |
          cargo build --locked --release -p openatc-ai -p openatc-stt --features openatc-ai/vulkan,openatc-stt/vulkan,openatc-ai/tts-cuda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path $env:OPENATC_VULKAN_LOADER -PathType Leaf)) { throw 'Verified Vulkan x64 loader is missing' }
          Copy-Item $env:OPENATC_VULKAN_LOADER target/release/vulkan-1.dll
          & .\target\release\openatc-ai.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\release\openatc-stt.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux AI server and speech sidecar
        if: runner.os == 'Linux' && matrix.product == 'ai-server'
        run: cargo build --locked --release -p openatc-ai -p openatc-stt --features openatc-ai/vulkan,openatc-stt/vulkan,openatc-ai/tts-cuda
      - name: Build macOS AI server and speech sidecar
        if: runner.os == 'macOS' && matrix.product == 'ai-server'
        run: cargo build --locked --release -p openatc-ai -p openatc-stt --features openatc-ai/tts-coreml,openatc-stt/metal
      - name: Exercise Windows companion engine
        if: runner.os == 'Windows' && matrix.product == 'plugin'
        shell: pwsh
        run: |
          cargo xtask test-radio target/release/open-atc-engine.exe speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask test-crew target/release/open-atc-engine.exe speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask test-speech target/release/open-atc-engine.exe speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask test-flight target/release/open-atc-engine.exe speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Linux and macOS companion engine
        if: runner.os != 'Windows' && matrix.product == 'plugin'
        run: |
          cargo xtask test-radio target/release/open-atc-engine speech
          cargo xtask test-crew target/release/open-atc-engine speech
          cargo xtask test-speech target/release/open-atc-engine speech
          cargo xtask test-flight target/release/open-atc-engine speech
      - name: Build packaging tools
        run: cargo build --locked --release -p xtask
      - name: Locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup 6 was not found in the machine or user installation directories' }
          Write-Host "Using Inno Setup compiler at $compiler; packaging preflight reports the engine version and checks compatibility."
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Install Linux packaging runtimes
        if: runner.os == 'Linux' && matrix.product == 'ai-server'
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm dpkg-dev flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          cargo test --locked -p xtask release::tests::flatpak_package_exports_with_png_icon -- --ignored --exact
          cargo xtask fetch-package-tools "$RUNNER_TEMP/package-tools"
          echo "APPIMAGETOOL=$RUNNER_TEMP/package-tools/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/package-tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo xtask release-package ${{ matrix.product }} ${{ matrix.platform }} "$env:RELEASE_VERSION"
      - name: Package Linux and macOS releases
        if: runner.os != 'Windows'
        run: cargo xtask release-package ${{ matrix.product }} ${{ matrix.platform }} "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.product }}
          path: packages/openatc-*
          if-no-files-found: error
      - name: Collect Windows build outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo xtask collect-artifacts ${{ matrix.product }} build-artifacts
      - name: Collect Linux and macOS build outputs
        if: runner.os != 'Windows'
        run: cargo xtask collect-artifacts ${{ matrix.product }} build-artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-${{ matrix.platform }}-${{ matrix.product }}
          path: build-artifacts/
          if-no-files-found: error
      - name: Remove temporary Apple signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/openatc-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
            security delete-keychain "$keychain"
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          packages=(openatc-*.zip openatc-*.exe openatc-*.dmg openatc-*.deb openatc-*.rpm openatc-*.AppImage openatc-*.flatpak)
          (( ${#packages[@]} > 0 )) || { echo 'No release packages downloaded'; exit 1; }
          checksums=()
          for package in "${packages[@]}"; do
            [[ -f "$package" && -f "$package.sha256" ]] || { echo "Missing package/checksum: $package"; exit 1; }
            checksums+=("$package.sha256")
          done
          sha256sum --check -- "${checksums[@]}"
          args=(--verify-tag --generate-notes --title "OpenATC $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${packages[@]}" "${checksums[@]}" "${args[@]}"
